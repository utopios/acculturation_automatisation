# Inventaire Ansible - Équipements réseau Telco
---
all:
  vars:
    ansible_user: root
    ansible_password: telco2024
    ansible_connection: ssh
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  children:
    # Routeurs Core (cœur de réseau)
    core_routers:
      hosts:
        router-01:
          ansible_host: 172.28.0.10
          router_role: core
          location: datacenter-paris
          vlans:
            - { id: 100, name: "SIP_SIGNALING", description: "Signalisation VoIP" }
            - { id: 101, name: "RTP_MEDIA", description: "Flux média RTP" }
            - { id: 200, name: "MANAGEMENT", description: "Administration" }
          qos_profile: voip_core

    # Routeurs Edge (bordure)
    edge_routers:
      hosts:
        router-02:
          ansible_host: 172.28.0.11
          router_role: edge
          location: pop-lyon
          vlans:
            - { id: 100, name: "SIP_SIGNALING", description: "Signalisation VoIP" }
            - { id: 101, name: "RTP_MEDIA", description: "Flux média RTP" }
            - { id: 300, name: "INTERNET", description: "Peering Internet" }
          qos_profile: voip_edge

    # Routeurs Access (accès client)
    access_routers:
      hosts:
        router-03:
          ansible_host: 172.28.0.12
          router_role: access
          location: site-marseille
          vlans:
            - { id: 100, name: "SIP_SIGNALING", description: "Signalisation VoIP" }
            - { id: 101, name: "RTP_MEDIA", description: "Flux média RTP" }
            - { id: 400, name: "CLIENT_DATA", description: "Données client" }
          qos_profile: voip_access

    # Groupe pour tous les routeurs
    routers:
      children:
        core_routers:
        edge_routers:
        access_routers:
